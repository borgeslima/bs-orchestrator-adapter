name: servicebus-local

services:

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: servicebus-emulator
    pull_policy: always

    volumes:
      - ./config/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json

    ports:
      - "5672:5672"
      - "5300:5300"

    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "YourStrong!Password123"
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: "5300"

    depends_on:
      sqledge:
        condition: service_healthy

    networks:
      - servicebus

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: servicebus-sqledge

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Password123"

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Password123\" -Q \"SELECT 1\" || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Password123\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    networks:
      - servicebus

  vectora:
    image: lyubomirhristovv/vectora:latest
    container_name: servicebus-vectora

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      VECTORA_PASSWORD: "pass@20"

    volumes:
      - vectora-data:/data

    networks:
      - servicebus

    depends_on:
      - servicebus-emulator

networks:
  servicebus:
    driver: bridge

volumes:
  vectora-data: