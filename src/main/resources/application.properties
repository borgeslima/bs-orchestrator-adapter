spring.application.name=orch

# Porta da aplicacao. Default 8081 porque a 8080 e usada pelo container 'vectora'
# do docker-compose local. Sobrescreva com a variavel de ambiente SERVER_PORT.
server.port=${SERVER_PORT:8081}

# ==========================================================================
# MongoDB (estado da orquestracao)
# ATENCAO: nao commitar credenciais. Prefira variavel de ambiente MONGODB_URI.
# A senha exposta durante o desenvolvimento deve ser rotacionada apos a POC.
# ==========================================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://baas-orch:ML1mrhjKr9QhcDuZ@baas-c1.a7tap7r.mongodb.net/baas-orch?retryWrites=true&w=majority}

# ==========================================================================
# Endpoint das etapas (mock)
# As 4 etapas (oferta, elegibilidade, simulacao, formalizacao) usam, nesta POC,
# o mesmo endpoint mock com contrato { "id": "<uuid>" } -> { "id": "<uuid>" }.
# ==========================================================================
orch.etapas.endpoint-base=${ETAPAS_ENDPOINT:https://free.mockerapi.com/mock/141caf88-d77d-4ac5-b2d1-1a232d7e3d09}

# ==========================================================================
# Azure Service Bus (transporte entre etapas)
# Emulador local por padrao (UseDevelopmentEmulator=true). Externalizar via
# variavel de ambiente SERVICEBUS_CONNECTION_STRING em outros ambientes.
# ==========================================================================
spring.cloud.azure.servicebus.connection-string=${SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=6aa41ecb-e788-83e9-a48c-9d86b7fe47e6;UseDevelopmentEmulator=true;}

# Fila unica de orquestracao usada para publicar/consumir os comandos de etapa.
orch.servicebus.fila=${SERVICEBUS_FILA:orchestration}
